<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Match Challenge </title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap"
  rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Memory Card Match Challenge</h1>
    </header>

    <div class="app-container">
    <div class="instruction-banner">
  Tap two cards to find matching pairs <span id="flip-count" class="flip-badge">| Moves: 0</span>
</div>
    
    <main class="game-board" id="board">
        <button class="memory-card" onclick="flipCard(this)" data-icon="🍎">?</button>
        <button class="memory-card" onclick="flipCard(this)" data-icon="🔑">?</button>
        <button class="memory-card" onclick="flipCard(this)" data-icon="🌸">?</button>
        <button class="memory-card" onclick="flipCard(this)" data-icon="🔑">?</button>
        <button class="memory-card" onclick="flipCard(this)" data-icon="🍎">?</button>
        <button class="memory-card" onclick="flipCard(this)" data-icon="🍎">?</button>
    </main>

    <button class="restart-btn" onclick="initGame()">Restart Game</button>
  </div>

  <div id="successModal" class="modal-overlay">
    <div class="modal-card">
      <div class="star-badge">⭐ ⭐ ⭐</div>
      <h2>Wonderful Job!</h2>
      <p>You matched all the pairs perfectly! Your memory is shining bright today.</p>
      <button class="play-again-btn" onclick="initGame()">Play Again </button>
    </div>
  </div>

    <script src="script.js"></script>
</body>
</html>
